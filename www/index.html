<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=0.5, maximum-scale=5.0, user-scalable=yes">
<title>تحلیل دانه‌بندی سنگدانه - ۴۹۷۷</title>
<style>
:root{--primary:#0067c0;--bg:#f4f7fb;--border:#cbd5e1;--success:#059669;--danger:#dc2626}
*{box-sizing:border-box}
/* اضافه شدن ویژگی زوم لمسی به body */
body{font:13px Tahoma,Arial,sans-serif;background:var(--bg);margin:0;padding:12px;color:#1e293b; touch-action: pan-x pan-y pinch-zoom;}
.card{background:white;border-radius:10px;padding:14px;margin:0 auto 14px;max-width:1000px;box-shadow:0 2px 8px #0001}
h2{text-align:center;color:var(--primary);font-size:17px;margin:2px 0 16px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:6px 8px;margin-bottom:7px}
.field{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.field label{font-size:12px;font-weight:bold;flex:1}
.field input,.field select{font:12px Tahoma,Arial,sans-serif;border:1px solid var(--border);border-radius:6px;padding:6px 5px;min-width:0;width:145px;max-width:55%;background:white;text-align:center}
.field input.numeric{width:8ch;max-width:8ch;direction:ltr;font-family:Arial,sans-serif;font-size:14px}
.field input:focus,.field select:focus{outline:2px solid var(--primary)}
.table-container{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:600px;font-size:11px}
th,td{border:1px solid #e2e8f0;padding:7px 3px;text-align:center}
th{background:#f1f5f9}
td input.numeric{width:8ch;max-width:100%;padding:6px 2px;text-align:center;direction:ltr;border:1px solid var(--border);border-radius:4px;font:12px Arial,sans-serif}
.results-box{display:flex;gap:10px;justify-content:space-around;flex-wrap:wrap;background:#e0f2fe;padding:12px;border-radius:8px;margin-top:12px;font-weight:bold;color:#0369a1}
.warning-box{color:var(--danger);font-size:13px;margin-top:10px;line-height:1.9; font-weight: bold;}
.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
button{flex:1;min-width:95px;padding:12px 6px;border:0;border-radius:8px;color:white;font:bold 13px Tahoma;cursor:pointer}
.btn-calc{background:var(--success)}.btn-pdf{background:var(--primary)}.btn-reset{background:#64748b}
.ok{color:var(--success);font-weight:bold}.not-ok{color:var(--danger);font-weight:bold}
.chart-wrap{width:100%;overflow:hidden;direction:ltr}
canvas{display:block;width:100%;height:340px}
@media(max-width:420px){body{padding:7px}.card{padding:10px}.row{grid-template-columns:1fr}.field input,.field select{width:150px}canvas{height:300px}}

/* فشرده‌سازی جدول و ثابت‌ماندن ستون مشخصات الک */
.table-container table{width:max-content;min-width:100%;table-layout:fixed;font-size:10px}
.table-container th,.table-container td{padding:5px 2px;min-width:0;white-space:nowrap}
.table-container th:first-child,.table-container td:first-child{position:sticky;right:0;z-index:2;background:#fff;min-width:57px;width:57px;max-width:57px;box-shadow:-2px 0 3px #0002}
.table-container thead th:first-child{z-index:3;background:#f1f5f9}
.table-container th:nth-child(2),.table-container td:nth-child(2){width:78px;min-width:78px}
.table-container th:nth-child(3),.table-container td:nth-child(3),.table-container th:nth-child(4),.table-container td:nth-child(4),.table-container th:nth-child(5),.table-container td:nth-child(5){width:57px;min-width:57px}
.table-container th:nth-child(6),.table-container td:nth-child(6){width:75px;min-width:75px}
.table-container th:nth-child(7),.table-container td:nth-child(7){width:58px;min-width:58px}
.table-container td input.numeric{width:6.5ch;max-width:100%;padding:4px 1px;font-size:11px}

/* Vista-inspired glass interface */
body{background:radial-gradient(circle at 12% 10%,#9ee7ff 0,transparent 35%),radial-gradient(circle at 85% 25%,#c8b5ff 0,transparent 38%),linear-gradient(145deg,#e4f5ff,#e6e9ff 55%,#dcf9f4);min-height:100vh}
.card{background:linear-gradient(145deg,rgba(255,255,255,.91),rgba(235,246,255,.78));border:1px solid rgba(255,255,255,.95);box-shadow:0 10px 30px #254b832b,inset 0 1px 0 #fff;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:16px}
h2{color:#124a9c;text-shadow:0 1px 0 #fff;border-bottom:1px solid #b9d6f4;padding-bottom:12px}
.field input,.field select{background:linear-gradient(#fff,#f2f8ff);box-shadow:inset 0 1px 3px #204b7616,0 1px 0 white;border-color:#b7cce4}
button{border:1px solid #ffffff99;box-shadow:inset 0 2px 1px #ffffff70,inset 0 -3px 4px #00000016,0 4px 9px #17385d36;text-shadow:0 1px 1px #0004;transition:filter .15s,transform .15s}
button:active{transform:translateY(1px)}
button:hover{filter:brightness(1.09)}
.btn-calc{background:linear-gradient(#46d7a0,#05865c)}
.btn-pdf{background:linear-gradient(#66b9ff,#0766c6)}
.btn-reset{background:linear-gradient(#a8b7d0,#53647f)}
.results-box{background:linear-gradient(120deg,#d7f4ff,#e3e5ff);border:1px solid #fff;box-shadow:inset 0 1px 4px #3268a51b}
.table-container{border:1px solid #b8d2ee;border-radius:9px;background:#fff}
.table-container table{font-size:9px;min-width:0}
.table-container th,.table-container td{padding:4px 1px}
.table-container th:first-child,.table-container td:first-child{width:45px;min-width:45px;max-width:45px}
.table-container th:nth-child(2),.table-container td:nth-child(2){width:64px;min-width:64px}
.table-container th:nth-child(3),.table-container td:nth-child(3),.table-container th:nth-child(4),.table-container td:nth-child(4),.table-container th:nth-child(5),.table-container td:nth-child(5){width:48px;min-width:48px}
.table-container th:nth-child(6),.table-container td:nth-child(6){width:66px;min-width:66px}
.table-container th:nth-child(7),.table-container td:nth-child(7){width:57px;min-width:57px}
.table-container td input.numeric{width:5.7ch;font-size:10px;padding:3px 0}
.table-container th{background:linear-gradient(#edf7ff,#d8eafb);color:#18447a}
.table-container tbody tr:nth-child(even) td{background:#f4f9ff}
.table-container tbody tr:nth-child(even) td:first-child{background:#edf5ff}
.usage-results{margin-top:13px;display:grid;gap:7px}
.usage-results:empty{display:none}
.usage-message{padding:10px 12px;border-radius:9px;font-size:13px;font-weight:bold;line-height:1.9;border:1px solid;box-shadow:inset 0 1px 0 #fff,0 2px 6px #0000000a; text-align: right;}
.usage-message.allow{color:#086b42;border-color:#9edcbd;background:linear-gradient(#f0fff6,#d8f7e6)}
.usage-message.deny{color:#a11c2b;border-color:#f0a7ad;background:linear-gradient(#fff3f3,#ffdddd)}

/* عنوان برنامه و دکمه‌های مستقل */
.app-title{line-height:1.75;margin-bottom:14px!important}
.app-title span{display:block;font-size:18px;font-weight:800;letter-spacing:0;color:#153f70}
.app-title small{display:block;font-size:12px;font-weight:600;color:#536b86;letter-spacing:0}
.action-bar{display:flex;align-items:center;gap:10px;margin-top:12px}
.action-bar button{flex:1;min-width:0}

/* نمودار */
.chart-card{overflow:hidden}
.chart-wrap{border:1px solid #d6e3f1;border-radius:12px;background:linear-gradient(180deg,#fff,#fbfdff);padding:4px;box-shadow:inset 0 1px 3px #153f7010}
.chart-wrap canvas{height:350px;width:100%;display:block}

/* استایل مخصوص چاپ (PDF) */
@media print {
  @page { size: A4 portrait; margin: 8mm; }
  body { background: #fff !important; color: #000; padding: 0; margin: 0; }
  .card { box-shadow: none !important; border: 1px solid #ccc !important; background: #fff !important; margin-bottom: 20px !important; page-break-inside: avoid; }
  .action-bar { display: none !important; } 
  .chart-wrap { border: none !important; }
}
</style>
</head>

<body>

<div class="card">
  <h2 class="app-title">
    <span>دانه بندی سنگدانه ریز و درشت</span>
    <small>استاندارد ملی ایران شماره های 302-406-4977</small>
  </h2>

  <div class="row">
    <div class="field"><label for="company">نام شرکت</label><input id="company" placeholder="اختیاری"></div>
    <div class="field"><label for="sampleId">شماره نمونه</label><input id="sampleId" placeholder="اختیاری"></div>
    <div class="field"><label for="date">تاریخ</label><input id="date" placeholder="۱۴۰۵/۰۸/۰۹"></div>
  </div>

  <div class="row">
    <div class="field">
      <label for="materialName">نام سنگدانه</label>
      <select id="materialName">
        <option>ماسه طبیعی</option>
        <option>شن طبیعی</option>
        <option>ماسه شکسته</option>
        <option>شن شکسته</option>
        <option>مخلوط شن و ماسه</option>
      </select>
    </div>

    <div class="field">
      <label for="materialCategory">نوع سنگدانه</label>
      <select id="materialCategory" onchange="toggleCategoryFields()">
        <option>ریزدانه</option>
        <option>درشت‌دانه</option>
      </select>
    </div>

    <div class="field">
      <label for="spClass">کلاس دانه‌بندی</label>
      <select id="spClass"></select>
    </div>
  </div>

  <div class="row">
    <div class="field">
      <label for="totalWeight">وزن کل نمونه (گرم)</label>
      <input id="totalWeight" class="numeric" type="text" inputmode="decimal" maxlength="6" autocomplete="off">
    </div>

    <div class="field">
      <label for="afterWash">وزن بعد از شستشو (گرم)</label>
      <input id="afterWash" class="numeric" type="text" inputmode="decimal" maxlength="6" autocomplete="off">
    </div>

    <div class="field" id="baseModulusField">
      <label for="baseModulus">مدول نرمی مبنا</label>
      <input id="baseModulus" class="numeric" type="text" inputmode="decimal" maxlength="6" value="2.90">
    </div>
  </div>
</div>

<div class="card">
  <h2>جدول الک‌ها</h2>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>نمره الک</th>
          <th>وزن مانده (gr)</th>
          <th>مانده (%)</th>
          <th>تجمعی (%)</th>
          <th>عبوری (%)</th>
          <th>محدوده مجاز</th>
          <th>انطباق</th>
        </tr>
      </thead>
      <tbody id="sieveBody"></tbody>
    </table>
  </div>

  <div class="results-box">
    <span>مدول نرمی: <b id="tvFm">-</b></span>
    <span>عبوری از الک ۲۰۰: <b id="tvPassing200">-</b></span>
  </div>

  <div class="warning-box" id="warnBox"></div>
  <div class="usage-results" id="usageResults" aria-live="polite"></div>

  <div class="action-bar">
    <button class="btn-calc" onclick="calculate()">محاسبه</button>
    <button class="btn-pdf" onclick="exportPDF()">خروجی PDF</button>
    <button class="btn-reset" onclick="resetAll()">بازنشانی</button>
  </div>
</div>

<div class="card chart-card">
  <h2>منحنی دانه بندی</h2>
  <div class="chart-wrap">
    <canvas id="gradingChart" role="img" aria-label="نمودار نیمه لگاریتمی اندازه الک و درصد عبوری"></canvas>
  </div>
</div>

<script>
'use strict';

// ================== تنظیمات پرداخت کافه‌بازار ==================
const BAZAAR_RSA_PUBLIC_KEY = 'YOUR_RSA_PUBLIC_KEY_HERE'; 
const PRODUCT_ID = 'full_version_unlock'; 

let isPurchased = localStorage.getItem('app_purchased') === 'true';
let freeTrialCount = parseInt(localStorage.getItem('app_free_trial_count') || '0', 10);
const MAX_FREE_TRIAL = 7;

async function initBazaarPayment() {
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.CafebazaarPoolakey) {
        try {
            const { CafebazaarPoolakey } = window.Capacitor.Plugins;
            await CafebazaarPoolakey.initialize({ rsaPublicKey: BAZAAR_RSA_PUBLIC_KEY });
            const purchaseInfo = await CafebazaarPoolakey.getPurchaseInfo();
            if (purchaseInfo && purchaseInfo.purchases && purchaseInfo.purchases.length > 0) {
                const owned = purchaseInfo.purchases.find(p => p.productId === PRODUCT_ID);
                if (owned) {
                    isPurchased = true;
                    localStorage.setItem('app_purchased', 'true');
                }
            }
        } catch (error) { console.error('Bazaar init error:', error); }
    }
}

async function showPaymentDialog() {
    if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.CafebazaarPoolakey) {
        const { CafebazaarPoolakey } = window.Capacitor.Plugins;
        try {
            const result = await CafebazaarPoolakey.purchaseProduct({ productId: PRODUCT_ID, payload: 'user_purchase' });
            if (result.state === 'PURCHASED') {
                processSuccessfulPayment();
            } else if (result.state === 'CANCELLED') {
                alert('پرداخت لغو شد.');
            } else {
                alert('پرداخت انجام نشد.');
            }
        } catch (error) {
            alert('خطا در ارتباط با درگاه پرداخت: ' + (error.message || error));
        }
    } else {
        const userWantsToPay = confirm("تعداد دفعات استفاده رایگان شما به پایان رسید.\nبرای مشاهده نتایج بیشتر، باید نسخه کامل را خریداری کنید.\n\nآیا مایل به پرداخت هستید؟ (حالت تست)");
        if (userWantsToPay) processSuccessfulPayment();
    }
}

function processSuccessfulPayment() {
    isPurchased = true;
    localStorage.setItem('app_purchased', 'true');
    alert("پرداخت با موفقیت انجام شد.");
    calculate();
}
// ==============================================================

const sieves=['100','90','75','63','50','37.5','25','19','12.5','9.5','4.75','2.36','1.18','0.6','0.3','0.15','0.075'];

const ranges={
'ماسه رده1':{'0.075':[0,3],'0.15':[0,10],'0.3':[5,30],'0.6':[25,60],'1.18':[50,85],'2.36':[80,100],'4.75':[95,100],'9.5':[100,100]},
'ماسه رده2':{'0.075':[0,3],'0.15':[2,10],'0.3':[5,30],'0.6':[20,50],'1.18':[35,80],'2.36':[60,100],'4.75':[85,100],'9.5':[100,100]},
'ماسه رده3':{'0.075':[2,5],'0.15':[10,20],'0.3':[15,40],'0.6':[30,60],'1.18':[45,80],'2.36':[65,100],'4.75':[90,100],'9.5':[100,100]},
'شن رده 9':{'0.6':[0,5],'1.18':[0,10],'2.36':[10,40],'4.75':[85,100],'9.5':[100,100]},
'شن رده 89':{'0.6':[0,5],'1.18':[0,10],'2.36':[5,30],'4.75':[20,55],'9.5':[90,100],'12.5':[100,100]},
'شن رده 8':{'1.18':[0,5],'2.36':[0,10],'4.75':[10,30],'9.5':[85,100],'12.5':[100,100]},
'شن رده 7':{'2.36':[0,5],'4.75':[0,15],'9.5':[40,70],'12.5':[90,100],'19':[100,100]},
'شن رده 67':{'2.36':[0,5],'4.75':[0,10],'9.5':[20,55],'19':[90,100],'25':[100,100]},
'شن رده 6':{'4.75':[0,5],'9.5':[0,15],'12.5':[20,55],'19':[90,100],'25':[100,100]},
'شن رده 57':{'2.36':[0,5],'4.75':[0,10],'12.5':[25,60],'25':[95,100],'37.5':[100,100]},
'شن رده 56':{'4.75':[0,5],'9.5':[0,15],'12.5':[10,40],'19':[40,85],'25':[90,100],'37.5':[100,100]},
'شن رده 5':{'9.5':[0,5],'12.5':[0,10],'19':[20,55],'25':[90,100],'37.5':[100,100]},
'شن رده 467':{'4.75':[0,5],'9.5':[10,30],'19':[35,70],'37.5':[95,100],'50':[100,100]},
'شن رده 4':{'9.5':[0,5],'19':[0,15],'25':[20,55],'37.5':[90,100],'50':[100,100]},
'شن رده 357':{'4.75':[0,5],'12.5':[10,30],'25':[35,70],'50':[95,100],'63':[100,100]},
'شن رده 3':{'12.5':[0,5],'25':[0,15],'37.5':[35,70],'50':[90,100],'63':[100,100]},
'شن رده 2':{'19':[0,5],'37.5':[0,15],'50':[35,70],'63':[90,100],'75':[100,100]},
'شن رده 1':{'19':[0,5],'37.5':[0,15],'63':[25,60],'90':[90,100],'100':[100,100]}
};

const sieveLabels={
'0.075':'#200','0.15':'#100','0.3':'#50','0.6':'#30',
'1.18':'#16','2.36':'#8','4.75':'#4','9.5':'3/8″',
'12.5':'1/2″','19':'3/4″','25':'1″','37.5':'½1″',
'50':'2″','63':'½2″','75':'3″','90':'½3″','100':'4″'
};

const $=id=>document.getElementById(id);
let lastResult=null;

function normalizeDigits(v){
  return String(v).replace(/[۰-۹]/g,c=>String(c.charCodeAt(0)-1776)).replace(/[٠-٩]/g,c=>String(c.charCodeAt(0)-1632)).replace(/٫/g,'.').replace(/٬/g,'');
}
function cleanNumeric(v){
  v=normalizeDigits(v).replace(/[^0-9.]/g,'');
  let dot=v.indexOf('.');
  if(dot>=0)v=v.slice(0,dot+1)+v.slice(dot+1).replace(/\./g,'');
  return v.slice(0,6);
}
function number(id){
  const v=normalizeDigits($(id).value);
  return v.trim()===''?NaN:Number(v);
}

function buildTable(){
  const body=$('sieveBody');
  body.innerHTML='';
  sieves.forEach(s=>{
    let tr=document.createElement('tr');
    tr.innerHTML=`
      <td><b>${sieveLabels[s]||s}</b></td>
      <td><input class="numeric" id="w-${s}" type="text" inputmode="decimal" maxlength="6" autocomplete="off" placeholder=""></td>
      <td id="ret-${s}">-</td>
      <td id="cum-${s}">-</td>
      <td id="pas-${s}">-</td>
      <td id="rng-${s}">-</td>
      <td id="cmp-${s}">-</td>`;
    body.appendChild(tr);
  });

  document.querySelectorAll('input.numeric').forEach(el=>{
    el.addEventListener('input',()=>{
      let v=cleanNumeric(el.value);
      if(el.value!==v)el.value=v;
      invalidate();
    });
  });
}

function invalidate(){
  lastResult=null;
  ['tvFm','tvPassing200'].forEach(id=>$(id).textContent='-');
  $('warnBox').textContent='';
  $('usageResults').innerHTML='';

  sieves.forEach(s=>{
    ['ret','cum','pas','cmp'].forEach(p=>$(p+'-'+s).textContent='-');
    $('cmp-'+s).className='';
  });
  drawChart();
}

function toggleCategoryFields(){
  const fine=$('materialCategory').value==='ریزدانه';
  $('baseModulusField').style.display='flex';
  const cls=$('spClass');
  const old=cls.value;
  cls.innerHTML='<option value="نمی‌دانم">نمی‌دانم</option>';
  Object.keys(ranges).filter(k=>fine?k.startsWith('ماسه'):k.startsWith('شن')).forEach(k=>cls.add(new Option(k,k)));
  if([...cls.options].some(o=>o.value===old))cls.value=old;
  
  // تغییر فیلد مدول نرمی به فیلد عبوری الک ۲۰۰ برای درشت‌دانه
  const baseLabel = document.querySelector('#baseModulusField label');
  const baseInput = $('baseModulus');
  if (fine) {
    baseLabel.textContent = 'مدول نرمی مبنا';
    baseInput.readOnly = false;
    baseInput.style.background = '';
    baseInput.value = baseInput.dataset.fmValue || '2.90';
    baseInput.removeAttribute('data-org');
  } else {
    baseLabel.textContent = 'عبوری از الک ۲۰۰ (%)';
    baseInput.readOnly = true;
    baseInput.style.background = '#f1f5f9';
    baseInput.removeAttribute('data-fmValue');
    if (lastResult && Number.isFinite(lastResult.passing200)) {
      baseInput.value = lastResult.passing200.toFixed(2);
    } else {
      baseInput.value = '';
    }
  }
  
  updateRanges();
}

function updateRanges(){
  const r=ranges[$('spClass').value]||{};
  sieves.forEach(s=>{ $('rng-'+s).textContent=r[s]?r[s].join(' - ')+'%':'-'; });
  invalidate();
}

function calculate(){
  const total=number('totalWeight');
  const after=number('afterWash');
  const base=number('baseModulus');
  const cat=$('materialCategory').value;
  const cls=$('spClass').value;

  if(!Number.isFinite(total)||total<=0) return alert('وزن کل نمونه باید عددی مثبت باشد.');
  if(!Number.isFinite(after)||after<=0||after>total) return alert('وزن بعد از شستشو باید مثبت و حداکثر برابر وزن کل باشد.');
  if(cat==='ریزدانه'&&(!Number.isFinite(base)||base<=0)) return alert('مدول نرمی مبنا باید مثبت باشد.');

  let weights={}, enteredCount=0, sum=0;
  for(const s of sieves){
    const raw=normalizeDigits($('w-'+s).value);
    if(raw!==''&&(!Number.isFinite(Number(raw))||Number(raw)<0)) return alert('وزن الک نامعتبر است.');
    if(raw !== '') {
      weights[s] = Number(raw);
      sum += Number(raw);
      enteredCount++;
    } else {
      weights[s] = null; 
    }
  }

  if(enteredCount === 0) return alert('وزن مانده حداقل یک الک را وارد کنید.');

  const washLoss=total-after;
  const diff=Math.abs(after-sum);
  const tol=total*0.003; 
  const passing200=washLoss/total*100;
  
  let retained={}, cumulative={}, passing={};
  let cumSum = 0;
  
  for(const s of sieves){
    if (weights[s] !== null) {
      const pct = (weights[s] / total) * 100;
      cumSum += pct;
      retained[s] = pct;
      cumulative[s] = cumSum;
      passing[s] = 100 - cumSum;
    } else {
      retained[s] = null;
      cumulative[s] = null;
      passing[s] = null;
    }
  }

  const hasPan = weights['0.075'] !== null;
  if(!hasPan && total > 0) {
    passing['0.075'] = passing200;
    cumulative['0.075'] = 100 - passing200;
  }

  const fmSieves=['4.75','2.36','1.18','0.6','0.3','0.15'];
  let fmSum = 0;
  let fmCount = 0;
  fmSieves.forEach(s => {
    if (cumulative[s] !== null) {
      fmSum += cumulative[s];
      fmCount++;
    }
  });
  const fm = fmCount > 0 ? (fmSum / 100) : NaN;

  const r=ranges[cls]||{};

  // ================== منطق دقیق شرط الک 200 ==================
  let max200 = null;
  const isCrushed = $('materialName').value.includes('شکسته');
  
  if (cat === 'ریزدانه') {
      if (isCrushed) {
          if (cls === 'ماسه رده3') max200 = 16;
          else max200 = 7;
      } else {
          if (cls === 'ماسه رده3') max200 = 5;
          else max200 = 5;
      }
  }
  // ========================================================

  for(const s of sieves){
    if (weights[s] !== null) {
      $('ret-'+s).textContent=retained[s].toFixed(1)+'%';
      $('cum-'+s).textContent=cumulative[s].toFixed(1)+'%';
      $('pas-'+s).textContent=passing[s].toFixed(1)+'%';

      let status='-';
      let rangeText = '-';

      if (s === '0.075' && cat === 'ریزدانه') {
          rangeText = 'طبق پاورقی جدول ۱ استاندارد ۳۰۲';
          if (max200 !== null) {
              status = passing200 <= max200 + 1e-8 ? 'منطبق' : 'نامنطبق';
          }
      } else if (r[s]) {
          rangeText = r[s].join(' - ') + '٪';
          status = passing[s] >= r[s][0] - 1e-8 && passing[s] <= r[s][1] + 1e-8 ? 'منطبق' : 'نامنطبق';
      }

      $('rng-'+s).textContent = rangeText;
      $('cmp-'+s).textContent = status;
      $('cmp-'+s).className = status === 'منطبق' ? 'ok' : (status === 'نامنطبق' ? 'not-ok' : '');
      
    } else {
      $('ret-'+s).textContent='-';
      $('cum-'+s).textContent='-';
      $('pas-'+s).textContent='-';
      $('rng-'+s).textContent = (s === '0.075' && cat === 'ریزدانه') ? 'طبق پاورقی جدول ۱ استاندارد ۳۰۲' : '-';
      $('cmp-'+s).textContent='-';
      $('cmp-'+s).className='';
    }
  }

  $('tvFm').textContent=cat==='ریزدانه' && !isNaN(fm) ? fm.toFixed(2) : '-';
  $('tvPassing200').textContent=total > 0 ? passing200.toFixed(2)+'%' : '-';

  // بروزرسانی فیلد غیرقابل ویرایش عبوری الک ۲۰۰ برای درشت‌دانه
  if (cat !== 'ریزدانه') {
    $('baseModulus').value = passing200.toFixed(2);
  } else {
    $('baseModulus').dataset.fmValue = base.toFixed(2);
  }

  // ================== منطق نمایش هشدارها و جملات ==================
  const box = $('usageResults');
  box.replaceChildren(); 
  const warnBox = $('warnBox');
  warnBox.textContent = ''; 

  if (diff > tol) {
      const el1 = document.createElement('div');
      el1.className='usage-message deny'; 
      el1.textContent = 'اختلاف وزن جمع الک‌ها با وزن بعد از شستن بیش از حد مجاز است.';
      box.appendChild(el1);

      const el2 = document.createElement('div');
      el2.className='usage-message deny'; 
      el2.textContent = 'از نتایج این آزمون برای اهداف پذیرش استفاده نگردد (نتیجه مردود).';
      box.appendChild(el2);
  } else {
      const panMismatch = hasPan && Math.abs(passing['0.075']-passing200) > 0.3;
      if (cat === 'ریزدانه' && !isNaN(fm) && Math.abs(fm - base) > 0.2) {
          warnBox.textContent = 'اختلاف مدول نرمی با مبنا بیش از ۰٫۲ است.';
      }
      if (panMismatch) {
          warnBox.textContent += (warnBox.textContent ? ' | ' : '') + 'اختلاف عبوری الک ۰٫۰۷۵ میلی‌متر با افت شستشو بیش از ۰٫۳ واحد درصد است.';
      }

      const pct = passing200;
      let maxNormal, maxAbrasion;

      if (cat === 'درشت‌دانه') {
          const gravelLimit = isCrushed ? 1.5 : 1.0;
          maxNormal = gravelLimit;
          maxAbrasion = gravelLimit;
      } else if (isCrushed) {
          if (cls === 'ماسه رده3') {
              maxNormal = 16; maxAbrasion = 9;
          } else {
              maxNormal = 7; maxAbrasion = 5;
          }
      } else {
          if (cls === 'ماسه رده3') {
              maxNormal = 5; maxAbrasion = 3;
          } else {
              maxNormal = 5; maxAbrasion = 3;
          }
      }

      function add(name, allowed){
        const el=document.createElement('div');
        el.className='usage-message '+(allowed?'allow':'deny');
        el.textContent = `این سنگدانه برای استفاده در ${name} ${allowed?'مجاز است':'ممنوع است'}.`;
        box.appendChild(el);
      }

      add('بتن مسلح و معمولی', pct <= maxNormal);
      add('بتن تحت شرایط ذوب و یخبندان', pct <= maxNormal);
      add('بتن تحت سایش', pct <= maxAbrasion);
  }
  // =======================================================

  lastResult={
    weights,retained,cumulative,passing,passing200,fm,
    total,after,cls,cat,diff,tol,hasPan
  };

  if (!isPurchased) {
      if (freeTrialCount < MAX_FREE_TRIAL) {
          freeTrialCount++;
          localStorage.setItem('app_free_trial_count', freeTrialCount.toString());
          if (freeTrialCount === MAX_FREE_TRIAL) {
            alert("شما از ۷ بار محاسبه رایگان استفاده کردید. برای محاسبات بعدی، لطفاً برنامه را خریداری کنید.");
          }
          drawChart();
          return;
      } else {
          $('tvFm').textContent = '-';
          $('tvPassing200').textContent = '-';
          $('usageResults').innerHTML = '';
          warnBox.textContent = '';
          drawChart();
          showPaymentDialog();
          return;
      }
  }

  drawChart();
}

function drawChart(){
  const canvas=$('gradingChart');
  if(!canvas)return;
  const wrap=canvas.parentElement;
  const width=Math.max(280,Math.floor(wrap.clientWidth-8));
  const height=350;
  const dpr=Math.min(window.devicePixelRatio||1,2);
  canvas.style.width=width+'px'; canvas.style.height=height+'px';
  canvas.width=Math.round(width*dpr); canvas.height=Math.round(height*dpr);
  const c=canvas.getContext('2d');
  if(!c)return;
  c.setTransform(dpr,0,0,dpr,0,0);
  c.clearRect(0,0,width,height);
  c.fillStyle='#fff'; c.fillRect(0,0,width,height);

  const m={left:43,right:12,top:65,bottom:49};
  const ph=height-m.top-m.bottom;
  const ascending=sieves.map(Number).sort((a,b)=>a-b);
  const selectedRange=ranges[$('spClass').value]||{};
  const rangeSizes=Object.keys(selectedRange).map(Number).filter(v=>Number.isFinite(v)&&v>0).sort((a,b)=>a-b);

  let axisMin, axisMax;
  if(rangeSizes.length>0){
    const minRangeSize=rangeSizes[0];
    const minIndex=ascending.indexOf(minRangeSize);
    axisMin=minIndex>0?ascending[minIndex-1]:ascending[0];
    const maxRangeSize=rangeSizes[rangeSizes.length-1];
    const maxIndex=ascending.indexOf(maxRangeSize);
    axisMax=maxIndex>=0&&maxIndex<ascending.length-1?ascending[maxIndex+1]:ascending[ascending.length-1];
  }else{
    axisMin=ascending[0]; axisMax=ascending[ascending.length-1];
  }
  if(!Number.isFinite(axisMin)||axisMin<=0)axisMin=ascending[0];
  if(!Number.isFinite(axisMax)||axisMax<=axisMin)axisMax=ascending[ascending.length-1];

  const plotLeft=m.left, plotRight=width-m.right, plotWidth=plotRight-plotLeft;
  const logLow=Math.log10(axisMin), logHigh=Math.log10(axisMax), logSpan=logHigh-logLow;

  const x=value=>{
    const v=Number(value);
    if(!Number.isFinite(v)||v<=0)return NaN;
    return plotLeft+(Math.log10(v)-logLow)/logSpan*plotWidth;
  };
  const y=value=>m.top+(100-value)/100*ph;

  c.font='10px Arial'; c.textBaseline='middle'; c.textAlign='right';
  for(let p=0;p<=100;p+=5){
    const yy=y(p), major=p%10===0;
    c.beginPath(); c.setLineDash([]);
    c.strokeStyle=major?'#cbd5e1':'#e9eef5'; c.lineWidth=major?1:.65;
    c.moveTo(plotLeft,yy); c.lineTo(plotRight,yy); c.stroke();
    if(major){ c.fillStyle='#334155'; c.fillText(String(p),m.left-7,yy); }
  }

  c.save(); c.beginPath(); c.rect(plotLeft,m.top,plotWidth,ph); c.clip();
  ascending.forEach(s=>{
    if(s<axisMin||s>axisMax)return;
    const xx=x(s); if(!Number.isFinite(xx))return;
    c.beginPath(); c.setLineDash([3,3]); c.lineWidth=.7; c.strokeStyle='#9aaabd';
    c.moveTo(xx,m.top); c.lineTo(xx,m.top+ph); c.stroke();
  });
  c.restore(); c.setLineDash([]);

  c.strokeStyle='#26374d'; c.lineWidth=1; c.strokeRect(plotLeft,m.top,plotWidth,ph);
  c.font='7px Arial'; c.textAlign='center'; c.textBaseline='middle'; c.fillStyle='#26374d';

  ascending.forEach(s=>{
    if(s<axisMin||s>axisMax)return;
    const xx=x(s); if(!Number.isFinite(xx))return;
    c.fillText(sieveLabels[String(s)]||String(s),xx,m.top-22);
    c.beginPath(); c.strokeStyle='#64748b'; c.lineWidth=.6;
    c.moveTo(xx,m.top-15); c.lineTo(xx,m.top-3); c.stroke();
  });

  function line(points,color,dash,lw){
    const validPoints=points.filter(([sx,sy])=>Number.isFinite(sx)&&Number.isFinite(sy)&&sx>=axisMin&&sx<=axisMax&&sy>=0&&sy<=100);
    if(validPoints.length<2)return;
    c.save(); c.beginPath(); c.rect(plotLeft,m.top,plotWidth,ph); c.clip();
    c.beginPath(); let started=false;
    validPoints.forEach(([sx,sy])=>{
      const xx=x(sx), yy=y(sy);
      if(!Number.isFinite(xx)||!Number.isFinite(yy))return;
      if(!started){ c.moveTo(xx,yy); started=true; } else { c.lineTo(xx,yy); }
    });
    if(started){ c.strokeStyle=color; c.lineWidth=lw; c.setLineDash(dash); c.stroke(); }
    c.restore(); c.setLineDash([]);
  }

  const standardKeys=Object.keys(selectedRange).map(Number).filter(k=>k>=axisMin&&k<=axisMax).sort((a,b)=>a-b);
  line(standardKeys.map(k=>[k,selectedRange[String(k)][0]]),'#111',[],1.4);
  line(standardKeys.map(k=>[k,selectedRange[String(k)][1]]),'#111',[],1.4);

  if(lastResult&&lastResult.passing){
    const sample=ascending.filter(s=>s>=axisMin&&s<=axisMax).map(s=>[s,lastResult.passing[String(s)]]).filter(([s,p])=>p !== null && Number.isFinite(p)&&p>=0&&p<=100);
    line(sample,'#dc0000',[5,4],2);
    c.save(); c.beginPath(); c.rect(plotLeft,m.top,plotWidth,ph); c.clip(); c.fillStyle='#dc0000';
    sample.forEach(([s,p])=>{
      const xx=x(s), yy=y(p); if(!Number.isFinite(xx)||!Number.isFinite(yy))return;
      c.beginPath(); c.arc(xx,yy,2.7,0,Math.PI*2); c.fill();
    });
    c.restore();
  }

  c.fillStyle='#243c5b'; c.font='bold 11px Tahoma,Arial'; c.textAlign='center'; c.textBaseline='middle';
  c.fillText('اندازه سنگدانه (mm)',plotLeft+plotWidth/2,height-17);
  c.save(); c.translate(13,m.top+ph/2); c.rotate(-Math.PI/2); c.fillText('درصد عبوری',0,0); c.restore();
}

async function exportPDF() {
    if (!lastResult) {
        alert("ابتدا دکمه محاسبه را بزنید.");
        return;
    }

    let defaultName = `گزارش_دانه_بندی_${$('sampleId').value || 'نمونه'}`;
    let fileName = prompt("لطفاً نام فایل خروجی را وارد کنید:", defaultName);
    
    if (fileName === null) {
        return; 
    }
    if (fileName.trim() === "") {
        fileName = "گزارش_دانه_بندی"; 
    }

    try {
        if (window.Capacitor && window.Capacitor.isNativePlatform()) {
            const { Printer } = window.Capacitor.Plugins;
            if (Printer) {
                const printHTML = buildPrintHTML();
                await Printer.print({ content: printHTML, name: fileName });
            } else {
                alert('پلاگین چاپ پیدا نشد.');
            }
        } else {
            window.print();
        }
    } catch (error) {
        console.error(error);
        alert('خطا در ایجاد خروجی PDF. لطفاً دوباره تلاش کنید.');
    }
}

                    <div class="info-item"><span class="label">${modulusLabel}</span>${modulusOrPassing200HTML}</div>
                </div>

                <table>
                    <thead>
                        <tr>
                            <th>نمره الک</th>
                            <th>وزن مانده (gr)</th>
                            <th>مانده (%)</th>
                            <th>تجمعی (%)</th>
                            <th>عبوری (%)</th>
                            <th>محدوده مجاز</th>
                            <th>انطباق</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${tableHTML}
                    </tbody>
                </table>

                <div class="chart-container">
                    <img src="${chartDataUrl}" alt="منحنی دانه بندی">
                </div>

                ${messagesHTML}
            </div>
        </body>
        </html>
    `;
}
// فعال‌سازی زوم در اندروید
if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.ZoomPlugin) {
    window.Capacitor.Plugins.ZoomPlugin.setZoomEnabled({ enabled: true });
}
</script>

</body>
</html>
