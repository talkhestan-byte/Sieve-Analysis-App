
name: Build Sieve Analysis for Cafe Bazaar

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Sign Sieve Analysis
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare web app
        run: |
          mkdir -p www
          cp index.html www/
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6
          npm install --save-dev @capacitor/cli@6
          npm install @bcyesil/capacitor-plugin-printer@0.0.5

      - name: Configure Capacitor
        run: |
          npx cap init "Sieve Analysis" com.yourname.sieveanalysis --web-dir www
          npx cap add android
          npx cap sync android

      - name: Restore persistent signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -eu

          test -n "$KEYSTORE_BASE64" || {
            echo "ERROR: Missing SIGNING_KEYSTORE_BASE64"
            exit 1
          }

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode \
            > android/app/release-key.jks

          test -s android/app/release-key.jks

      - name: Configure release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          if not path.is_file():
              raise SystemExit(
                  "ERROR: android/app/build.gradle not found"
              )

          content = path.read_text()

          if "signingConfigs {" in content:
              raise SystemExit(
                  "ERROR: Existing signingConfigs found; "
                  "refusing to modify the file automatically"
              )

          build_types = content.find("buildTypes {")
          if build_types < 0:
              raise SystemExit("ERROR: buildTypes block not found")

          release = content.find("release {", build_types)
          if release < 0:
              raise SystemExit("ERROR: release build type not found")

          line_start = content.rfind("\n", 0, release) + 1
          release_line = content[line_start:content.find("\n", release)]
          indent = release_line[:len(release_line) -
                                len(release_line.lstrip())]

          signing_line = (
              indent + "    signingConfig signingConfigs.release\n"
          )

          content = (
              content[:release + len("release {")] +
              "\n" + signing_line +
              content[release + len("release {"):]
          )

          signing_block = """
              signingConfigs {
                  release {
                      storeFile file("release-key.jks")
                      storePassword System.getenv("SIGNING_STORE_PASSWORD")
                      keyAlias System.getenv("SIGNING_KEY_ALIAS")
                      keyPassword System.getenv("SIGNING_KEY_PASSWORD")
                  }
              }

          """

          build_types = content.find("buildTypes {")
          content = (
              content[:build_types] +
              signing_block +
              content[build_types:]
          )

          path.write_text(content)
          print("Release signing configuration added.")
          PY

      - name: Build signed release AAB
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -eu

          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_PASSWORD"

          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

          test -s app/build/outputs/bundle/release/app-release.aab

      - name: Download official Cafe Bazaar Bundle Signer
        run: |
          set -eu

          curl --fail --location --silent --show-error \
            https://github.com/cafebazaar/bundle-signer/releases/download/v0.1.13/bundlesigner-0.1.13.jar \
            --output bundlesigner.jar

          test -s bundlesigner.jar

      - name: Generate Cafe Bazaar BIN
        env:
          KS_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.SIGNING_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -eu

          mkdir -p output

          java -jar bundlesigner.jar genbin \
            --verbose \
            --bundle android/app/build/outputs/bundle/release/app-release.aab \
            --bin output \
            --v2-signing-enabled true \
            --v3-signing-enabled false \
            --ks android/app/release-key.jks \
            --ks-type PKCS12 \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "env:KS_PASS" \
            --key-pass "env:KEY_PASS"

          cp android/app/build/outputs/bundle/release/app-release.aab \
            output/Sieve-Analysis.aab

          echo "Generated output files:"
          find output -maxdepth 1 -type f -printf '%f\n'

          test -n "$(find output -maxdepth 1 -name '*.bin' -print -quit)"
          test -s output/Sieve-Analysis.aab

      - name: Upload Cafe Bazaar release files
        uses: actions/upload-artifact@v4
        with:
          name: Sieve-Analysis-CafeBazaar
          path: output/*
          if-no-files-found: error
