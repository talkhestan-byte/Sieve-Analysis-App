name: Build Sieve Analysis for Cafe Bazaar

'on':
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Build APK, AAB and Cafe Bazaar BIN
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare web app
        run: |
          set -eu
          test -s www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6
          npm install --save-dev @capacitor/cli@6 typescript esbuild
          npm install @salarizadi/capacitor-cafebazaar-poolakey
          npm install @bcyesil/capacitor-plugin-printer@0.0.5
          
          # --- نصب پلاگین‌های مورد نیاز فایل PDF ---
          npm install @capacitor/filesystem@6
          npm install @capacitor-community/file-opener@6.0.1
          
          npm install @bcyesil/capacitor-plugin-printer@0.0.5
          npm install html2pdf.js

          if [ -f www/native-pdf.js ]; then
            npx esbuild www/native-pdf.js --bundle --format=esm --outfile=www/native-pdf.bundle.js
          fi

          if [ -d "node_modules/html2pdf.js/dist" ]; then
            cp node_modules/html2pdf.js/dist/html2pdf.bundle.min.js www/ 2>/dev/null || true
          fi

      - name: Configure Capacitor
        run: |
          set -eu

          rm -f capacitor.config.ts capacitor.config.json
          cat > capacitor.config.json <<'EOF'
          {
          "appId": "com.yourname.sieveanalysis",
          "appName": "دانه بندی",
          "webDir": "www"
          }
          EOF

          npx cap add android
          npx cap sync android

          # ================== فعال‌سازی زوم در وب‌ویو ==================
          # این خط به اندروید می‌گوید که زوم لمسی را در WebView فعال کند
          sed -i 's/WebSettings settings = webView.getSettings();/WebSettings settings = webView.getSettings();\n        settings.setBuiltInZoomControls(true);\n        settings.setSupportZoom(true);\n        settings.setDisplayZoomControls(false);/' android/app/src/main/java/com/yourname/sieveanalysis/MainActivity.java || true
          # ============================================================

          # افزودن JitPack
          PROJECT_GRADLE="android/build.gradle"
          if ! grep -q "jitpack.io" "$PROJECT_GRADLE"; then
          sed -i '/allprojects {/,/repositories {/ s/repositories {/repositories {\n        maven { url "https:\/\/jitpack.io" }/' "$PROJECT_GRADLE"
          fi

          # اعمال آیکون‌ها
          if [ -d "assets" ]; then
            RES_DIR="android/app/src/main/res"
            for d in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              if [ -f "assets/icon-only.png" ]; then
                cp "assets/icon-only.png" "$RES_DIR/$d/ic_launcher.png"
                cp "assets/icon-only.png" "$RES_DIR/$d/ic_launcher_round.png"
              fi
              if [ -f "assets/icon-background.png" ]; then
                cp "assets/icon-background.png" "$RES_DIR/$d/ic_launcher_background.png"
              fi
              if [ -f "assets/icon-foreground.png" ]; then
                cp "assets/icon-foreground.png" "$RES_DIR/$d/ic_launcher_foreground.png"
              fi
            done
            mkdir -p "$RES_DIR/mipmap-anydpi-v26/"
            cat > "$RES_DIR/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@mipmap/ic_launcher_background" />
              <foreground android:drawable="@mipmap/ic_launcher_foreground" />
          </adaptive-icon>
          EOF
          fi

      - name: Build Debug APK
        run: |
          set -eu
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk
          cd ..
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/Sieve-Analysis-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sieve-Analysis-APK
          path: output/Sieve-Analysis-debug.apk
          if-no-files-found: error
          retention-days: 14
