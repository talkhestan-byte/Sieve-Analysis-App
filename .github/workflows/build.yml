
name: Build Sieve Analysis App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.*'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6
          npm install --save-dev @capacitor/cli@6 typescript
          npm install @bcyesil/capacitor-plugin-printer@0.0.5
          npm install html2pdf.js

      - name: Prepare web app
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp node_modules/html2pdf.js/dist/html2pdf.bundle.min.js www/

      - name: Create Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.yourname.sieveanalysis",
            "appName": "Sieve Analysis",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare signing keystore
        if: ${{ env.SIGNING_KEYSTORE_BASE64 != '' }}
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sieve-release.jks"
          test -s "$RUNNER_TEMP/sieve-release.jks"

      - name: Configure release signing
        if: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          cat >> android/app/build.gradle <<'EOF'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("RUNNER_TEMP") + "/sieve-release.jks")
                      storePassword System.getenv("SIGNING_STORE_PASSWORD")
                      keyAlias System.getenv("SIGNING_KEY_ALIAS")
                      keyPassword System.getenv("SIGNING_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build signed release AAB
        if: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Download Cafe Bazaar bundle signer
        if: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p tools output
          curl -fL \
            https://github.com/cafebazaar/bundle-signer/releases/download/v0.1.13/bundle-signer \
            -o tools/bundle-signer
          chmod +x tools/bundle-signer

      - name: Generate Cafe Bazaar BIN
        if: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab output/app-release.aab
          tools/bundle-signer generate \
            -v 1 \
            -k "$RUNNER_TEMP/sieve-release.jks" \
            -p "$SIGNING_STORE_PASSWORD" \
            -a "$SIGNING_KEY_ALIAS" \
            -ap "$SIGNING_KEY_PASSWORD" \
            -b output/app-release.aab \
            -o output/app-release.bin

      - name: Collect APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/app-debug.apk

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sieve-analysis-build
          path: output/
          if-no-files-found: error
          retention-days: 14
